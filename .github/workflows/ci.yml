# Vérifie chaque pull request : tests automatisés et construction du site.
name: Vérifications

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
