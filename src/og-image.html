<!doctype html>
<!--
  Gabarit des images de partage (Open Graph), 1200 × 630 px, une par langue :
  assets/img/og-image.png (français) et assets/img/og-image-nl.png (néerlandais).
  Non publié. Les textes viennent des dictionnaires src/i18n/<langue>.json (même syntaxe que src/pages/).
  Pour régénérer les images : node scripts/og-image.js (voir ce script).
  Couleurs et motifs repris de la page d'accueil (bandeau .hero-backdrop et logo).
-->
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <title>{{t:ogImage.pageTitle}} — {{t:site.brand}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      isolation: isolate;
      padding: 64px 72px;
      font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
      color: #fff;
      background-color: #132a50;
      background-image:
        radial-gradient(ellipse 70% 60% at 90% 0%, rgb(47 95 174 / 0.55), transparent 70%),
        radial-gradient(ellipse 50% 50% at 0% 100%, rgb(245 197 66 / 0.1), transparent 70%);
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgb(255 255 255 / 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, #000, transparent 85%);
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand svg { width: 64px; height: 64px; }
    .brand strong { display: block; font-size: 30px; letter-spacing: -0.01em; }
    .brand span { display: block; margin-top: 2px; font-size: 19px; color: #b6cdeb; }
    .badge {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 44px; padding: 8px 18px;
      border: 1px solid rgb(255 255 255 / 0.15); border-radius: 999px;
      background: rgb(255 255 255 / 0.05);
      font-size: 19px; color: #d9e6f5;
    }
    .badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #f5c542; }
    h1 { margin-top: 24px; max-width: 760px; font-size: 54px; line-height: 1.12; letter-spacing: -0.02em; }
    h1 em { font-style: normal; color: #f5c542; }
    .chips { display: flex; gap: 10px; margin-top: 36px; }
    .chips li {
      list-style: none; padding: 8px 14px; border-radius: 8px;
      background: rgb(255 255 255 / 0.1); font-size: 19px; font-weight: 700; color: #d9e6f5;
    }
    .footer {
      position: absolute; left: 72px; right: 72px; bottom: 50px;
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 20px; color: #b6cdeb;
    }
    .footer strong { font-size: 26px; color: #f5c542; letter-spacing: 0.01em; }
    .shapes { position: absolute; right: 64px; top: 120px; width: 280px; height: 280px; }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#0c1a33"/>
      <circle cx="10.5" cy="10.5" r="4.5" fill="#f5c542"/>
      <rect x="17" y="6" width="9" height="9" rx="1.5" fill="#ffffff"/>
      <path d="M16 17.5 22 26H10Z" fill="#ffffff"/>
    </svg>
    <div>
      <strong>{{t:site.brand}}</strong>
      <span>{{t:site.tagline}}</span>
    </div>
  </div>

  <p class="badge">{{t:home.hero.badge}}</p>
  <h1>{{t:ogImage.title}}</h1>
  <ul class="chips">
    <li>{{t:ogImage.chips.abstrait}}</li>
    <li>{{t:ogImage.chips.verbal}}</li>
    <li>{{t:ogImage.chips.numerique}}</li>
    <li>{{t:ogImage.chips.jugement}}</li>
    <li>{{t:ogImage.chips.examen}}</li>
  </ul>

  <!-- Motif du logo, en grand -->
  <svg class="shapes" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="10.5" cy="10.5" r="4.5" fill="#f5c542" fill-opacity="0.9"/>
    <rect x="17" y="6" width="9" height="9" rx="1.5" fill="#ffffff" fill-opacity="0.16"/>
    <path d="M16 17.5 22 26H10Z" fill="#ffffff" fill-opacity="0.16"/>
  </svg>

  <div class="footer">
    <strong>selor-epso-prep.eu</strong>
    <span>{{t:ogImage.footer}}</span>
  </div>
</body>
</html>
