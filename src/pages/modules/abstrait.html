{{> head}}
  <script type="module" src="{{root}}assets/js/abstrait/app.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800 antialiased">
{{> header}}

  <main id="contenu" class="mx-auto w-full max-w-3xl flex-1 px-4 py-8 sm:px-6 sm:py-12">
    {{> breadcrumb}}

    <div class="mt-4 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">{{t:pages.abstrait}}</h1>
        <p class="mt-2 max-w-xl text-slate-600">{{t:abstrait.intro}}</p>
      </div>
      <dl class="flex shrink-0 gap-3 text-center">
        <div class="min-w-24 rounded-xl bg-white px-4 py-2 ring-1 ring-slate-200">
          <dt class="text-xs font-medium text-slate-500">{{t:common.question}}</dt>
          <dd class="text-lg font-bold text-brand-900 tabular-nums" data-question-number>1</dd>
        </div>
        <div class="min-w-24 rounded-xl bg-white px-4 py-2 ring-1 ring-slate-200">
          <dt class="text-xs font-medium text-slate-500">{{t:common.score}}</dt>
          <dd class="text-lg font-bold text-brand-900 tabular-nums" data-score>0 / 0</dd>
        </div>
      </dl>
    </div>

    <!-- Révision des erreurs : bouton « Revoir mes erreurs (n) », bandeau et bilan (assets/js/progression/review.js) -->
    <div data-review></div>

    {{> file-warning}}

    <section class="mt-8 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6" aria-labelledby="question-titre">
      <div class="flex items-center justify-between gap-3">
        <h2 id="question-titre" class="scroll-mt-24 text-base font-semibold text-slate-900 sm:text-lg" tabindex="-1">{{t:abstrait.question}}</h2>
        <span class="difficulty" data-difficulty></span>
      </div>

      <ol class="mt-5 grid grid-cols-5 gap-2 sm:gap-3" aria-label="{{t:abstrait.sequenceLabel}}" data-sequence></ol>

      <h3 id="propositions-titre" class="mt-8 text-sm font-semibold text-slate-700">{{t:abstrait.options}}</h3>
      <div class="mt-3 grid grid-cols-4 gap-2 sm:gap-3" role="group" aria-labelledby="propositions-titre" data-options></div>

      <!-- Correction : zone annoncée aux lecteurs d'écran -->
      <div class="mt-6" aria-live="polite" data-feedback></div>

      <div class="mt-6 flex justify-end" data-next-wrapper hidden>
        <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-brand-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-800 sm:w-auto" data-next>
          <span data-next-label>{{t:common.nextQuestion}}</span>
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <p class="mt-4 hidden text-center text-xs text-slate-500 sm:block">
      {{t:abstrait.shortcuts}}
    </p>
  </main>

{{> footer}}

{{> file-warning-script}}
</body>
</html>
